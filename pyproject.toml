[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abo"
version = "0.1.0"
description = "ABO: security evaluation harness for tool-using LLM agents (prompt injection, tool abuse, exfiltration, on-chain actions)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
abo = "abo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
